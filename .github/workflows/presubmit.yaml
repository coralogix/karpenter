name: presubmit
on:
  push:
    branches: [coralogix-fork-v1.14.1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: presubmit-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  presubmit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: ./.github/actions/install-deps
      with:
        k8sVersion: "1.36.x"
    - name: Enable the actionlint matcher
      run: echo "::add-matcher::.github/actionlint-matcher.json"
    - run: K8S_VERSION=1.36.x make presubmit