apiVersion: v1
kind: List
items:
  - apiVersion: karpenter.sh/v1
    kind: NodeClaim
    metadata:
      name: node-a
      labels:
        karpenter.sh/nodepool: bench-pool
        node.kubernetes.io/instance-type: m5.4xlarge
        karpenter.sh/capacity-type: on-demand
        topology.kubernetes.io/zone: test-zone-1
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
    status:
      providerID: aws:///us-west-2a/i-nodea
      allocatable:
        cpu: "16"
        memory: 64Gi
      conditions:
        - type: Launched
          status: "True"
        - type: Registered
          status: "True"
        - type: Initialized
          status: "True"
        - type: Consolidatable
          status: "True"
  - apiVersion: karpenter.sh/v1
    kind: NodeClaim
    metadata:
      name: node-b
      labels:
        karpenter.sh/nodepool: bench-pool
        node.kubernetes.io/instance-type: m5.large
        karpenter.sh/capacity-type: on-demand
        topology.kubernetes.io/zone: test-zone-1
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
    status:
      providerID: aws:///us-west-2a/i-nodeb
      allocatable:
        cpu: "2"
        memory: 8Gi
      conditions:
        - type: Launched
          status: "True"
        - type: Registered
          status: "True"
        - type: Initialized
          status: "True"
        - type: Consolidatable
          status: "True"
