apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Pod
    metadata:
      name: app-a
      namespace: default
    spec:
      nodeName: node-a
      containers:
        - name: app
          image: nginx
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
  - apiVersion: v1
    kind: Pod
    metadata:
      name: app-b
      namespace: default
    spec:
      nodeName: node-b
      containers:
        - name: app
          image: nginx
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
